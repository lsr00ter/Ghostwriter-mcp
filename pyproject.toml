[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter-mcp"
version = "0.3.0"
description = "MCP server exposing the Ghostwriter GraphQL API for pentest report management"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "ghostwriter", "pentest", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "httpx2>=2.5",
  "python-dotenv>=1.0",
  # mcp 2.x renamed FastMCP to MCPServer; this server targets that API.
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ghostwriter-mcp = "main:main"

[tool.setuptools]
py-modules = ["main", "ghostwriter_api"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored upstream skills are not ours to restyle, and editing them would make
# every submodule bump conflict. They are covered by upstream's own validation.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Tool descriptions are intentionally long, multi-line strings.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
